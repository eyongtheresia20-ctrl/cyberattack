<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 800;
    }
    p {
      font-size: 11px;
      margin: 2px 0 0 0;
      color: #38bdf8;
    }
    .status-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }
    .badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-family: monospace;
    }
    .desc {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 6px;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 8px;
      background: #0ea5e9;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🛡️</div>
    <div>
      <h1>CyberGuard Sentinel</h1>
      <p>Protection Active du Navigateur</p>
    </div>
  </div>
  <div class="status-box">
    <div class="status-row">
      <span>Surveillance des onglets</span>
      <span class="badge">ACTIVE</span>
    </div>
    <div class="desc">
      Chaque site web ouvert dans Chrome est inspecté en moins de 20ms par le moteur IA de CyberGuard.
    </div>
  </div>
  <a href="http://localhost:3000/dashboard" target="_blank" class="btn">Ouvrir le Tableau de Bord</a>
</body>
</html>
